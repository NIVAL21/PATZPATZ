<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>פצפץ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #050505;
    --panel: #131313;
    --panel-2: #1c1c1c;
    --red: #e30613;
    --red-dark: #970109;
    --gold: #c6a24d;
    --gold-bright: #e8ca7e;
    --white: #f2f0ec;
    --muted: #8c8c8c;
    --line: rgba(198,162,77,0.25);
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Rubik', system-ui, sans-serif;
    background: var(--black);
    color: var(--white);
    margin: 0;
    padding: 18px 10px 60px;
    min-height: 100vh;
  }

  .table-frame {
    max-width: 480px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.7);
    padding: 20px 16px 26px;
    position: relative;
  }

  .mute-btn {
    position: absolute;
    top: 14px;
    left: 14px;
    width: 34px;
    height: 34px;
    padding: 0;
    margin: 0;
    border-radius: 6px;
    font-size: 15px;
    line-height: 1;
    background: var(--panel-2);
    border: 1px solid var(--line);
    box-shadow: none;
  }

  .onboarding-text {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    margin: 0 0 14px;
    line-height: 1.5;
  }

  h2.title {
    font-family: 'Suez One', serif;
    text-align: center;
    font-size: 38px;
    margin: 4px 0 6px;
    color: var(--gold-bright);
    letter-spacing: 3px;
  }
  h2.title::after {
    content: '';
    display: block;
    width: 56px;
    height: 3px;
    background: var(--red);
    margin: 10px auto 18px;
  }

  h3, h4 {
    font-family: 'Rubik', sans-serif;
    color: var(--gold-bright);
    font-weight: 700;
  }
  h3 { font-size: 15px; border-bottom: 1px solid var(--line); padding-bottom: 8px; letter-spacing: 0.5px; }
  h4 { font-size: 13px; margin: 0 0 8px; color: var(--gold); text-transform: uppercase; letter-spacing: 0.5px; }

  input, textarea {
    width: 100%;
    box-sizing: border-box;
    font-size: 16px;
    padding: 10px 12px;
    margin: 5px 0;
    font-family: inherit;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--white);
  }
  input::placeholder, textarea::placeholder { color: rgba(242,240,236,0.35); }
  input:focus, textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }

  button {
    width: 100%;
    cursor: pointer;
    font-family: 'Rubik', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.5px;
    padding: 12px;
    margin: 5px 0;
    border-radius: 6px;
    border: none;
    background: var(--red);
    color: var(--white);
    box-shadow: none;
    transition: filter 0.1s ease, transform 0.05s ease;
  }
  button:hover { filter: brightness(1.12); }
  button:active { transform: translateY(1px); filter: brightness(0.94); }
  button:disabled {
    background: #2a2a2a; color: #6b6b6b;
    box-shadow: none; cursor: not-allowed;
  }

  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }

  .card {
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    width: 44px; height: 60px; border: 1px solid #d4d0c8; border-radius: 5px; margin: 3px;
    cursor: pointer; user-select: none; background: var(--white);
    position: relative; vertical-align: top;
    box-shadow: 0 2px 5px rgba(0,0,0,0.5);
  }
  .card .rank { position: absolute; top: 3px; right: 5px; font-size: 12px; font-weight: 700; }
  .card .suit-big { font-size: 22px; line-height: 1; }
  .card.red { color: var(--red); }
  .card.black { color: #16130f; }
  .card.selected { outline: 2px solid var(--gold); box-shadow: 0 0 0 3px rgba(198,162,77,0.35); }
  .card.assigned { opacity: 0.3; cursor: default; filter: grayscale(70%); }
  .card.static { cursor: default; }
  .card.winner-glow {
    outline: 2px solid var(--gold-bright);
    box-shadow: 0 0 0 3px rgba(232,202,126,0.4);
    transform: translateY(-2px);
  }
  .card.faded { opacity: 0.35; filter: grayscale(50%); }

  @keyframes flipReveal {
    0%   { transform: perspective(400px) rotateY(-100deg); opacity: 0; }
    55%  { transform: perspective(400px) rotateY(8deg); opacity: 1; }
    75%  { transform: perspective(400px) rotateY(-4deg); }
    100% { transform: perspective(400px) rotateY(0deg); opacity: 1; }
  }
  .card.flip-in {
    animation: flipReveal 0.55s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    backface-visibility: hidden;
  }

  @keyframes dealIn {
    0% { opacity: 0; transform: translateY(-18px) scale(0.7); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card.deal-in {
    animation: dealIn 0.3s ease-out both;
  }

  .card.card-back {
    cursor: default;
    background: #101010;
    border: 1px solid var(--line);
    display: inline-flex; align-items: center; justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .card.card-back::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(135deg, transparent 0 6px, rgba(255,255,255,0.03) 6px 7px);
  }
  .card-back-teal .back-diamond { background: var(--gold); }
  .card-back-teal { border-color: rgba(198,162,77,0.5); }
  .card-back-black .back-diamond { background: var(--muted); }
  .card-back-black { border-color: rgba(140,140,140,0.35); }
  .card-back-red .back-diamond { background: var(--red); }
  .card-back-red { border-color: rgba(227,6,19,0.5); }
  .card.card-back .back-diamond {
    width: 13px; height: 13px;
    transform: rotate(45deg);
    border-radius: 1px;
    z-index: 1;
  }

  .mark-winner-btn {
    width: auto; margin: 0; padding: 4px 12px; font-size: 10px;
    border-radius: 4px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--muted);
    box-shadow: none; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .mark-winner-btn.active {
    background: var(--gold); color: #1a1400; border-color: var(--gold);
  }
  .mark-winner-btn.loser {
    background: rgba(227,6,19,0.15); color: #ff5c5c; border-color: rgba(227,6,19,0.4);
  }

  .board {
    border: 1px solid var(--line);
    border-left: 3px solid var(--red);
    border-radius: 6px;
    padding: 10px 10px 12px;
    margin: 12px 0;
    background: var(--panel-2);
  }
  .board > div { margin-top: 4px; font-size: 13px; color: var(--muted); }

  .players { list-style: none; padding: 0; margin: 6px 0 14px; }
  .players li {
    padding: 8px 12px; margin-bottom: 6px; border-radius: 6px;
    background: var(--panel-2); border: 1px solid var(--line);
    display: flex; justify-content: space-between; font-size: 14px;
  }
  .players li.locked { border-color: var(--gold); color: var(--gold-bright); }

  #log {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; font-size: 11px; font-family: 'Courier New', monospace; color: var(--muted);
    max-height: 110px; overflow-y: auto; white-space: pre-wrap; margin-top: 16px;
  }

  .hidden { display: none; }

  #scoreBox {
    border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin: 14px 0;
    background: var(--panel-2);
  }
  .score-row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 6px 0; border-bottom: 1px solid var(--line);
  }
  .score-row:last-child { border-bottom: none; }
  .score-row .score-name { font-weight: 700; color: var(--white); flex: 1; }
  .score-row input[type="number"] {
    width: 90px; margin: 0; text-align: center; font-weight: 700;
  }
  .score-row input[type="number"].pos { color: #5fce7f; border-color: #5fce7f; }
  .score-row input[type="number"].neg { color: #ff5c5c; border-color: #ff5c5c; }
</style>
</head>
<body>

<div class="table-frame">

<button id="muteBtn" class="mute-btn" onclick="toggleMute()">🔊</button>
<h2 class="title">פצפץ</h2>

<div id="setup">
  <p class="onboarding-text">
    אחד מכם פותח חדר חדש עם קוד לבחירה, והשאר מצטרפים עם אותו קוד בדיוק.
  </p>
  <input id="roomId" placeholder="קוד חדר">
  <input id="playerName" placeholder="השם שלך">
  <input id="boardValue" placeholder="שווי בורד">
  <div class="row">
    <button onclick="createRoom()">פתח חדר חדש</button>
    <button onclick="joinRoom()">הצטרף לחדר</button>
  </div>
</div>

<div id="roomView" class="hidden">
  <h3>חדר: <span id="roomIdLabel"></span></h3>
  <ul id="playersList" class="players"></ul>
  <button id="startBtn" onclick="startHand()" class="hidden">התחל יד</button>

  <div id="scoreBox">
    <h4>התוצאה המצטברת</h4>
    <div id="scoreRows"></div>
  </div>

  <div id="handView" class="hidden">
    <h4>הקלפים שלך (לחץ על קלף ואז על מספר בורד כדי להקצות)</h4>
    <div id="myCards"></div>

    <div id="boardsView"></div>

    <button id="submitBtn" onclick="submitSplit()" disabled>נעל חלוקה (0/12 הוקצו)</button>
  </div>

  <div id="resultView" class="hidden">
    <h3>תוצאה — כל הבורדים והחלוקות גלויים</h3>
    <div id="resultContent"></div>
    <button onclick="startHand()">יד חדשה (קלפים חדשים)</button>
  </div>
</div>

<div id="log"></div>

</div>

<script>
// === מנוע צלילים - מייצר צלילים בקוד עצמו, בלי קבצי סאונד חיצוניים ===
let isMuted = localStorage.getItem('patzpatz_muted') === '1';

function updateMuteBtn() {
  const btn = document.getElementById('muteBtn');
  if (btn) btn.textContent = isMuted ? '🔇' : '🔊';
}

function toggleMute() {
  isMuted = !isMuted;
  try { localStorage.setItem('patzpatz_muted', isMuted ? '1' : '0'); } catch (e) {}
  updateMuteBtn();
}

window.addEventListener('DOMContentLoaded', updateMuteBtn);

let audioCtx = null;
function getAudioCtx() {
  if (isMuted) return null;
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    audioCtx = new Ctx();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playTone(freq, startTime, duration, type, gainPeak) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  const t0 = ctx.currentTime + startTime;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(gainPeak || 0.12, t0 + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.02);
}

function playClick() { playTone(880, 0, 0.07, 'square', 0.07); }
function playStart() { playTone(392, 0, 0.09, 'triangle', 0.1); playTone(587, 0.07, 0.14, 'triangle', 0.12); }
function playLock() { playTone(440, 0, 0.09, 'triangle', 0.11); playTone(660, 0.08, 0.12, 'triangle', 0.1); }
function playScoreChange() { playTone(1046, 0, 0.08, 'sine', 0.11); playTone(1568, 0.06, 0.11, 'sine', 0.09); }
function playCardFlip() {
  const ctx = getAudioCtx();
  if (!ctx) return;

  const duration = 0.16;
  const bufferSize = Math.floor(ctx.sampleRate * duration);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
  }

  const noise = ctx.createBufferSource();
  noise.buffer = buffer;

  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.Q.value = 1.1;
  const t0 = ctx.currentTime;
  filter.frequency.setValueAtTime(2600, t0);
  filter.frequency.exponentialRampToValueAtTime(450, t0 + duration);

  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(0.22, t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  noise.start(t0);
  noise.stop(t0 + duration + 0.02);

  playTone(190, duration * 0.75, 0.05, 'triangle', 0.07);
}
function playDealTick() { playTone(700, 0, 0.04, 'sine', 0.05); }
function playWinner() { playTone(523, 0, 0.11, 'triangle', 0.14); playTone(659, 0.09, 0.11, 'triangle', 0.14); playTone(784, 0.18, 0.18, 'triangle', 0.17); }

let socket = null;
function getOrCreatePlayerId() {
  try {
    const saved = localStorage.getItem('patzpatz_player_id');
    if (saved) return saved;
    const fresh = 'p_' + Math.random().toString(36).slice(2, 8);
    localStorage.setItem('patzpatz_player_id', fresh);
    return fresh;
  } catch (e) {
    return 'p_' + Math.random().toString(36).slice(2, 8);
  }
}
let myPlayerId = getOrCreatePlayerId();
let currentAssignment = { 0: [], 1: [], 2: [] };
let selectedCard = null;
let lastPhase = null;
let isLocked = false;
let lastDealtState = null;
let pendingDealAnimation = false;

function log(msg) {
  const el = document.getElementById('log');
  el.textContent += msg + '\n';
  el.scrollTop = el.scrollHeight;
}

function suitInfo(cardStr) {
  const suit = cardStr.slice(-1);
  const symbols = { s: '♠', h: '♥', d: '♦', c: '♣' };
  return { symbol: symbols[suit], isRed: suit === 'h' || suit === 'd' };
}

function getServerUrl() {
  return window.location.protocol.startsWith('http') ? window.location.origin : 'http://localhost:3000';
}

function connect() {
  const url = getServerUrl();
  socket = io(url);
  socket.on('connect', () => log('מחובר לשרת: ' + socket.id));
  socket.on('disconnect', () => log('התנתק מהשרת'));
  socket.on('room_state', (state) => {
    log('עדכון מצב חדר, שלב: ' + state.phase);
    if (state.phase === 'dealt' && lastPhase !== 'dealt') {
      currentAssignment = { 0: [], 1: [], 2: [] };
      selectedCard = null;
      isLocked = false;
      pendingDealAnimation = true;
    }
    lastPhase = state.phase;
    renderState(state);
  });
  socket.on('score_update', ({ scores }) => {
    applyScores(scores);
  });
}

function createRoom() {
  playClick();
  connect();
  const roomId = document.getElementById('roomId').value;
  const name = document.getElementById('playerName').value || 'שחקן';
  const boardValue = Number(document.getElementById('boardValue').value) || 10;
  socket.once('connect', () => {
    socket.emit('create_room', { roomId, playerId: myPlayerId, name, boardValue }, (res) => {
      if (!res.ok) return log('שגיאה: ' + res.error);
      log('חדר נפתח בהצלחה');
      enterRoomView(roomId);
      renderState(res.state);
    });
  });
}

function joinRoom() {
  playClick();
  connect();
  const roomId = document.getElementById('roomId').value;
  const name = document.getElementById('playerName').value || 'שחקן';
  socket.once('connect', () => {
    socket.emit('join_room', { roomId, playerId: myPlayerId, name }, (res) => {
      if (!res.ok) return log('שגיאה: ' + res.error);
      log('הצטרפת לחדר בהצלחה');
      enterRoomView(roomId);
      renderState(res.state);
    });
  });
}

function enterRoomView(roomId) {
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('roomView').classList.remove('hidden');
  document.getElementById('roomIdLabel').textContent = roomId;
}

function startHand() {
  playStart();
  socket.emit('start_hand', {}, (res) => {
    if (!res.ok) log('שגיאה בהתחלת יד: ' + res.error);
  });
}

let lastScorePlayerIds = '';

function updateScoreColor(input) {
  const val = Number(input.value) || 0;
  input.classList.remove('pos', 'neg');
  if (val > 0) input.classList.add('pos');
  else if (val < 0) input.classList.add('neg');
}

function applyScores(scores) {
  Object.entries(scores || {}).forEach(([playerId, value]) => {
    const input = document.querySelector(`#scoreRows input[data-player-id="${playerId}"]`);
    if (!input) return;
    if (document.activeElement === input) return;
    if (String(value) !== input.value) playScoreChange();
    input.value = value;
    updateScoreColor(input);
  });
}

function renderScoreBox(players, scores) {
  const idsKey = players.map((p) => p.id).join(',');
  if (idsKey === lastScorePlayerIds) return;
  lastScorePlayerIds = idsKey;

  const container = document.getElementById('scoreRows');
  container.innerHTML = '';
  players.forEach((p) => {
    const row = document.createElement('div');
    row.className = 'score-row';

    const name = document.createElement('span');
    name.className = 'score-name';
    name.textContent = p.name;

    const input = document.createElement('input');
    input.type = 'number';
    input.value = (scores && scores[p.id]) || 0;
    input.dataset.playerId = p.id;
    updateScoreColor(input);
    input.oninput = () => {
      updateScoreColor(input);
      playScoreChange();
      socket.emit('update_score', { targetPlayerId: p.id, value: Number(input.value) || 0 });
    };

    row.appendChild(name);
    row.appendChild(input);
    container.appendChild(row);
  });
}

function renderState(state) {
  const playersList = document.getElementById('playersList');
  playersList.innerHTML = '';
  state.players.forEach((p) => {
    const li = document.createElement('li');
    let statusText = '';
    if (state.phase === 'dealt') {
      statusText = p.locked ? ' — ✅ ננעל' : ' — 🕐 בוחר קלפים...';
    } else if (p.locked) {
      statusText = ' ✓ ננעל';
    }
    li.textContent = p.name + (p.id === myPlayerId ? ' (אתה)' : '') + statusText;
    if (p.locked) li.className = 'locked';
    playersList.appendChild(li);
  });

  renderScoreBox(state.players, state.scores);

  document.getElementById('startBtn').classList.toggle('hidden', state.phase !== 'waiting' || state.players.length < 2);

  document.getElementById('handView').classList.add('hidden');
  document.getElementById('resultView').classList.add('hidden');

  if (state.phase === 'dealt') {
    document.getElementById('handView').classList.remove('hidden');
    renderHand(state);
  } else if (state.phase === 'revealed') {
    document.getElementById('resultView').classList.remove('hidden');
    renderResult(state);
  }
}

function cardEl(cardStr, opts = {}) {
  const { symbol, isRed } = suitInfo(cardStr);
  const rank = cardStr.slice(0, -1);
  const div = document.createElement('div');
  div.className = 'card ' + (isRed ? 'red' : 'black')
    + (opts.selected ? ' selected' : '')
    + (opts.assigned ? ' assigned' : '')
    + (opts.winner ? ' winner-glow' : '')
    + (opts.faded ? ' faded' : '')
    + (opts.flip ? ' flip-in' : '')
    + (opts.onClick ? '' : ' static');
  div.innerHTML = `<span class="rank">${rank}</span><span class="suit-big">${symbol}</span>`;
  if (opts.onClick) div.onclick = opts.onClick;
  return div;
}

function cardBackEl(variant) {
  const div = document.createElement('div');
  div.className = 'card card-back card-back-' + variant;
  const diamond = document.createElement('div');
  diamond.className = 'back-diamond';
  div.appendChild(diamond);
  return div;
}
const BACK_VARIANTS = ['teal', 'black', 'red'];

const RANK_ORDER = ['2', '3', '4', '5', '6', '7', '8', '9', 'T', 'J', 'Q', 'K', 'A'];
function rankValue(cardStr) {
  return RANK_ORDER.indexOf(cardStr.slice(0, -1));
}
function sortByRankDesc(cards) {
  return [...cards].sort((a, b) => rankValue(b) - rankValue(a));
}

function renderHand(state) {
  lastDealtState = state;
  const myCardsEl = document.getElementById('myCards');
  myCardsEl.innerHTML = '';
  const assignedCards = new Set([...currentAssignment[0], ...currentAssignment[1], ...currentAssignment[2]]);

  const animateDeal = pendingDealAnimation;
  pendingDealAnimation = false;

  sortByRankDesc(state.myHoleCards).forEach((c, idx) => {
    const isAssigned = assignedCards.has(c);
    const cardDiv = cardEl(c, {
      selected: c === selectedCard,
      assigned: isAssigned,
      onClick: isLocked ? undefined : () => {
        if (isAssigned) return;
        selectedCard = (selectedCard === c) ? null : c;
        renderHand(state);
      },
    });
    if (animateDeal) {
      cardDiv.classList.add('deal-in');
      cardDiv.style.animationDelay = (idx * 90) + 'ms';
      setTimeout(playDealTick, idx * 90);
    }
    myCardsEl.appendChild(cardDiv);
  });

  const boardsEl = document.getElementById('boardsView');
  boardsEl.innerHTML = '';
  state.boards.forEach((b, i) => {
    const div = document.createElement('div');
    div.className = 'board';
    const h4 = document.createElement('h4');
    h4.textContent = `בורד ${i + 1} (${currentAssignment[i].length}/4)`;
    div.appendChild(h4);

    const flopLabel = document.createElement('div');
    flopLabel.appendChild(document.createTextNode('פלופ: '));
    b.flop.forEach((c) => flopLabel.appendChild(cardEl(c)));
    const variant = BACK_VARIANTS[i % BACK_VARIANTS.length];
    flopLabel.appendChild(cardBackEl(variant));
    flopLabel.appendChild(cardBackEl(variant));
    div.appendChild(flopLabel);

    const myAssigned = document.createElement('div');
    myAssigned.appendChild(document.createTextNode('הקלפים שהוקצו: '));
    currentAssignment[i].forEach((c) => {
      myAssigned.appendChild(cardEl(c, isLocked ? {} : { onClick: () => {
        currentAssignment[i] = currentAssignment[i].filter((x) => x !== c);
        renderHand(state);
      }}));
    });
    div.appendChild(myAssigned);

    const assignBtn = document.createElement('button');
    assignBtn.textContent = `הקצה קלף נבחר לבורד ${i + 1}`;
    assignBtn.disabled = isLocked || !selectedCard || currentAssignment[i].length >= 4;
    assignBtn.onclick = () => {
      if (isLocked || !selectedCard) return;
      playClick();
      currentAssignment[i].push(selectedCard);
      selectedCard = null;
      renderHand(state);
    };
    div.appendChild(assignBtn);

    boardsEl.appendChild(div);
  });

  const total = currentAssignment[0].length + currentAssignment[1].length + currentAssignment[2].length;
  const submitBtn = document.getElementById('submitBtn');
  if (isLocked) {
    submitBtn.textContent = 'ננעל ✓ — ממתין לשאר השחקנים...';
    submitBtn.disabled = true;
  } else {
    submitBtn.textContent = `נעל חלוקה (${total}/12 הוקצו)`;
    submitBtn.disabled = total !== 12;
  }
}

function submitSplit() {
  playLock();
  socket.emit('submit_split', { split: currentAssignment }, (res) => {
    if (!res.ok) return log('שגיאה בנעילה: ' + res.error);
    log('החלוקה שלך ננעלה, ממתין לשאר השחקנים...');
    isLocked = true;
    if (lastDealtState) renderHand(lastDealtState);
  });
}

let lastRevealedState = null;
let lastKnownReveal = { boardIndex: -1, turnShown: false, riverShown: false };

function renderResult(state) {
  lastRevealedState = state;
  const content = document.getElementById('resultContent');
  content.innerHTML = '';

  const boardWinners = state.boardWinners || {};
  const reveal = state.revealStage || { boardIndex: state.boards.length - 1, turnShown: true, riverShown: true };

  state.boards.forEach((b, i) => {
    const div = document.createElement('div');
    div.className = 'board';
    const h4 = document.createElement('h4');
    h4.textContent = `בורד ${i + 1}`;
    div.appendChild(h4);

    const isPast = i < reveal.boardIndex;
    const isActive = i === reveal.boardIndex;
    const isFuture = i > reveal.boardIndex;
    const showTurn = isPast || (isActive && reveal.turnShown);
    const showRiver = isPast || (isActive && reveal.riverShown);

    const justRevealedTurn = isActive && reveal.turnShown &&
      !(lastKnownReveal.boardIndex === i && lastKnownReveal.turnShown);
    const justRevealedRiver = isActive && reveal.riverShown &&
      !(lastKnownReveal.boardIndex === i && lastKnownReveal.riverShown);
    if (justRevealedTurn || justRevealedRiver) playCardFlip();

    const variant = BACK_VARIANTS[i % BACK_VARIANTS.length];
    const cardsRow = document.createElement('div');
    b.flop.forEach((c) => cardsRow.appendChild(cardEl(c)));
    cardsRow.appendChild(
      showTurn && b.turn ? cardEl(b.turn, { flip: justRevealedTurn }) : cardBackEl(variant)
    );
    cardsRow.appendChild(
      showRiver && b.river ? cardEl(b.river, { flip: justRevealedRiver }) : cardBackEl(variant)
    );
    div.appendChild(cardsRow);

    if (isFuture) {
      const waitLabel = document.createElement('div');
      waitLabel.style.fontSize = '12px';
      waitLabel.style.color = 'var(--muted)';
      waitLabel.textContent = 'ממתין לסיום הבורד הקודם...';
      div.appendChild(waitLabel);
      content.appendChild(div);
      return;
    }

    if (isActive && !showRiver) {
      const waitLabel = document.createElement('div');
      waitLabel.style.fontSize = '12px';
      waitLabel.style.color = 'var(--muted)';
      waitLabel.textContent = 'חושף...';
      div.appendChild(waitLabel);
      content.appendChild(div);
      return;
    }

    state.players.forEach((p) => {
      const isWinner = boardWinners[i] === p.id;
      const hasWinner = boardWinners[i] !== undefined;
      const isLoser = hasWinner && !isWinner;

      const pDiv = document.createElement('div');
      pDiv.style.marginTop = '10px';
      pDiv.style.fontSize = '13px';

      const nameRow = document.createElement('div');
      nameRow.style.display = 'flex';
      nameRow.style.alignItems = 'center';
      nameRow.style.gap = '8px';
      nameRow.style.flexWrap = 'wrap';

      const label = document.createElement('span');
      label.textContent = `${p.name}:`;
      nameRow.appendChild(label);

      const markBtn = document.createElement('button');
      let btnClass = 'mark-winner-btn';
      if (isWinner) {
        markBtn.textContent = 'WINNER';
        btnClass += ' active';
      } else if (isLoser) {
        markBtn.textContent = 'LOSER';
        btnClass += ' loser';
      } else {
        markBtn.textContent = 'סמן כמנצח';
      }
      markBtn.className = btnClass;
      markBtn.onclick = () => {
        if (!isWinner) playWinner();
        socket.emit('set_board_winner', { board: i, playerId: p.id });
      };
      nameRow.appendChild(markBtn);

      pDiv.appendChild(nameRow);

      const splitLabel = document.createElement('div');
      splitLabel.textContent = 'שיבץ לבורד זה:';
      pDiv.appendChild(splitLabel);
      const splitRow = document.createElement('div');
      state.splits[p.id][i].forEach((c) => {
        splitRow.appendChild(cardEl(c, { winner: isWinner }));
      });
      pDiv.appendChild(splitRow);

      div.appendChild(pDiv);
    });

    content.appendChild(div);
  });

  lastKnownReveal = { boardIndex: reveal.boardIndex, turnShown: reveal.turnShown, riverShown: reveal.riverShown };
}
</script>
